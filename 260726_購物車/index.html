<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <h1>小柴的進階日貨小舖</h1>
    <img
      src="images/shiba_cover.png"
      alt="柴犬店長封面圖"
      width="1200px"
      class="shiba-img"
    />

    <!--搜尋控制台-->
    <div id="filter-console" style="text-align: center; margin: 20px;">
      <button class="filter-btn" data-category="all">全部商品</button>
      <button class="filter-btn" data-category="drink">茶飲區</button>
      <button class="filter-btn" data-category="snack">零食區</button>
      <button class="filter-btn" data-category="lifestyle">生活雜貨</button>

      <input type="text" id="search-input" placeholder="想找什麼日貨呢?" style="padding: 5px; margin-left: 20px;">
      <button id="search-btn">搜尋</button>
    </div>



    <div id="shop-shelf" class="card-container">
      <!--這個清單區塊是留給商品貨架-->
    </div>

    <button id="cart-toggle-btn">🛒 查看購物車</button><!-- 新增購物車浮動按鈕 -->

    <div id="cart-drawer"><!-- 購物車抽屜-->
      <h2 class="cart-title">🛒 你的專屬購物車</h2>
      <!--這個清單區塊現在是空的，等一下js機器人會把商品印在這裡-->
      <div id="cart-items">
        <p class="cart-name">目前車車裡還沒有東西喔！</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
